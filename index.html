<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 50th Birthday of Ros Mariani</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root {
            --bg-dark: #0a1128;
            --bg-light: #1c2541;
            --gold: #d4af37;
            --gold-gradient: linear-gradient(45deg, #b38728, #fbf5b7, #daa520, #fbf5b7, #aa771c);
            --silver: #e0e0e0;
            --text-light: #ffffff;
            --text-muted: #a5a5a5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            text-align: center;
        }

        h1, h2, h3, .gala-title {
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
        }

        .cursive {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: var(--silver);
        }

        /* Hero / Cover Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: radial-gradient(circle, var(--bg-light) 0%, var(--bg-dark) 100%);
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            opacity: 0.3;
        }

        .gold-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .hero h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--silver);
        }

        .hero h1 {
            font-size: 3rem;
            margin: 15px 0;
            line-height: 1.2;
        }

        /* Section Umum */
        section {
            padding: 80px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .divider {
            height: 2px;
            width: 80px;
            background: var(--gold-gradient);
            margin: 25px auto;
        }
